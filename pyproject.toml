version = "0.1.0"
description = "Preview how staged AGENTS.md changes affect tracked Git paths."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "xhl123XHL352", email = "194903029+xhl123XHL352@users.noreply.github.com"}]
dependencies = []

[project.urls]
